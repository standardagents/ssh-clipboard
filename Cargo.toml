[package]
name = "ssh-clipboard"
version = "0.2.10"
edition = "2024"
rust-version = "1.88"
description = "Native, encrypted clipboard sync over SSH"
license = "MIT"
repository = "https://github.com/standardagents/ssh-clipboard"

[[bin]]
name = "ssh-clipboard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.50", features = ["derive"] }
flate2 = "1.1.5"
hostname = "0.4.1"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
shell-words = "1.1.0"
tar = "0.4.44"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image"] }
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString", "NSURL", "NSFileCoordinator", "NSError", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
