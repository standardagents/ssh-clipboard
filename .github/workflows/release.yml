name: Release bundle

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      dist-tag: ${{ steps.meta.outputs.dist_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Parse release tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            {
              echo "version=$TAG"
              echo "dist_tag=latest"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([a-z][a-z0-9-]*)\.([0-9a-f]+)$ ]]; then
            {
              echo "version=$TAG"
              echo "dist_tag=${BASH_REMATCH[1]}"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Use vX.Y.Z or vX.Y.Z-<dist-tag>.<commit-hash>."
          exit 1
      - name: Require stable releases from main
        if: steps.meta.outputs.prerelease == 'false'
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Stable release tags must reference a commit on main."
            exit 1
          }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require tag and source versions to match
        run: npm run version:check -- "${{ steps.meta.outputs.version }}"

  binary:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            name: ssh-clipboard-darwin-arm64
          - runner: macos-15-intel
            name: ssh-clipboard-darwin-amd64
          - runner: ubuntu-24.04
            name: ssh-clipboard-linux-amd64
          - runner: ubuntu-24.04-arm
            name: ssh-clipboard-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: sudo bash .github/scripts/install-linux-build-deps.sh libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cp target/release/ssh-clipboard ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  bundle:
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: chmod +x dist/* && tar -C dist -czf ssh-clipboard-bundle.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-clipboard-bundle
          path: ssh-clipboard-bundle.tar.gz

  npm-package:
    needs: [metadata, binary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: npm run stage:binaries -- dist
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-clipboard-npm
          path: ssh-clipboard-*.tgz

  publish-npm:
    if: vars.NPM_PUBLISH == 'true'
    needs: [metadata, npm-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ssh-clipboard-npm
          path: package
      - name: Publish through npm trusted publishing
        shell: bash
        run: |
          PACKAGE=ssh-clipboard
          VERSION="${{ needs.metadata.outputs.version }}"
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published."
          else
            mapfile -t TARBALLS < <(find package -maxdepth 1 -type f -name 'ssh-clipboard-*.tgz' -print)
            if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one npm tarball, found ${#TARBALLS[@]}."
              exit 1
            fi
            TARBALL="$(realpath "${TARBALLS[0]}")"
            npm publish "$TARBALL" \
              --access public \
              --provenance \
              --tag "${{ needs.metadata.outputs.dist-tag }}"
          fi
